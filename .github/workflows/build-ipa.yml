name: Build and publish IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: fast5ga-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup toolchain install 1.100.0 --profile minimal
          rustup target add --toolchain 1.100.0 aarch64-apple-ios
      - name: Verify payloads
        run: python3 scripts/validate.py
      - name: Test native workflow
        run: cargo +1.100.0 test --locked --manifest-path rust-core/Cargo.toml --lib
      - name: Build native framework
        run: bash scripts/build-core.sh
      - name: Build and verify iPhone app
        run: bash scripts/build-ipa.sh
      - name: Publish IPA and SHA256 to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*MARKETING_VERSION: '\([^']*\)'.*/\1/p" project.yml)
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/Fast5GA.ipa build/SHA256SUMS.txt --clobber
            gh release edit "$tag" --title "Fast5GA $version" --notes-file .github/release-notes.md
          else
            gh release create "$tag" build/Fast5GA.ipa build/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Fast5GA $version" --notes-file .github/release-notes.md
          fi
