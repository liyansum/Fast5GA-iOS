name: Migrate editable source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Store editable sources and remove archive
        shell: bash
        run: |
          set -euo pipefail
          test ! -d App
          echo '3031b2d2e34b2d090bbc40b3fa6baddfa614f64d8153a6b4f72784e28b1f0988  Fast5GA-source.zip' | sha256sum -c -
          unzip -q Fast5GA-source.zip -d "$RUNNER_TEMP/fast5ga-migration"
          git -C "$RUNNER_TEMP/fast5ga-migration/Fast5GA" apply "$GITHUB_WORKSPACE/source-update.patch"
          rsync -a --exclude='/.github/workflows/' "$RUNNER_TEMP/fast5ga-migration/Fast5GA/" "$GITHUB_WORKSPACE/"
          git rm Fast5GA-source.zip source-update.patch
          git add App rust-core scripts THIRD_PARTY project.yml rust-toolchain.toml .gitignore README.md .github/release-notes.md
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Store full source tree and fix carrier payload bundle layout'
          git push origin HEAD:main
